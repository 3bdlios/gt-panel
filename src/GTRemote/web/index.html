<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d30"><meta name="apple-mobile-web-app-capable" content="yes"><title>GT Remote</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><span class="eyebrow">GT ENIGMA2</span><h1 dir="ltr">GT Remote</h1></div><span id="status" role="status" aria-live="polite">جارٍ الاتصال…</span></header>
<section id="controls" hidden aria-label="ريموت الرسيفر"><div class="toolbar" dir="ltr"><button id="power" aria-label="الطاقة" class="power">⏻</button><button id="message" aria-label="إرسال رسالة">✉</button><button id="text" aria-label="إدخال نص">T</button><button id="expand" aria-label="ملء الشاشة">⛶</button></div><div id="keys" dir="ltr"></div>
<div class="preview card"><label><input id="capture" type="checkbox"> عرض صورة القوائم بعد الضغط</label><p>التقاط القوائم فقط، دون تحديث مستمر.</p><button id="refresh" type="button" hidden>تحديث الصورة</button><img id="screenshot" alt="صورة قوائم الرسيفر" hidden></div><p class="hint">اضغط مطوّلًا لوظيفة الضغط المستمر. كل أزرار ريموت OpenWebif موجودة هنا.</p></section>
<p id="notice" role="alert" aria-live="polite"></p><footer>على شبكتك المحلية • OpenWebif</footer></main>
<dialog id="edit"><form id="editForm"><h2 id="editTitle"></h2><label for="entry">النص</label><textarea id="entry" maxlength="200" rows="3" required></textarea><div class="actions"><button id="cancel" type="button">إلغاء</button><button type="submit" class="primary">إرسال</button></div></form></dialog>
<dialog id="powerDialog"><h2>طاقة الرسيفر</h2><p>اختر وضع الرسيفر</p><div class="actions"><button data-power="5">وضع الاستعداد</button><button data-power="4">تشغيل</button><button id="closePower">إغلاق</button></div></dialog></body></html>
